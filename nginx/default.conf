# ===== a2a-gateway 统一反向代理 =====
# 容器内监听 80，由 docker-compose 映射为对外端口 ${GATEWAY_PORT:-10099}。
#   /api/*                 -> 后端 FastAPI (backend:8000)，支持 SSE 流式
#   /docs /redoc /openapi.json /health -> 后端
#   其余所有请求           -> 前端 Next.js (frontend:3000)
#
# 关于上游解析（重要，勿改回 upstream 块）：
#   这里没有写 `upstream { server backend:8000; }`，而是用「变量 + resolver」。
#   原因：upstream 块里的域名只在 nginx 启动时解析一次并长期缓存 IP；
#   docker compose 重建 backend/frontend 容器后 IP 会变化，
#   nginx 仍连向旧 IP —— 表现为「部署后全站 502，必须手动 restart nginx 才恢复」。
#   改用变量后，nginx 会按 resolver 的 TTL 在请求时重新解析，容器重建后自动恢复。

# 127.0.0.11 是 Docker 内嵌 DNS（容器加入用户自定义网络时可用）
resolver 127.0.0.11 valid=10s ipv6=off;

# 入口自适应（Agent Card 回连地址推导等依赖它）：
# 上游代理（宿主机 Caddy 等）声明过 X-Forwarded-* 就优先透传，缺失时按本层补全。
# 直连入口 Host 自带端口（:10099），必须用 $http_host 原样保留——$host 会剥掉端口。
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $fwd_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    server_name _;

    # 上传/请求体大小上限
    client_max_body_size 20m;

    # 公共代理头（各 location 继承）
    # 透传优先：上游声明过 X-Forwarded-* 就保留（域名入口的 https / 域名不被内层覆盖），
    # 直连时按本层补全（Host 保留端口），保证卡片回连地址在两种入口下都正确。
    proxy_http_version 1.1;
    proxy_set_header Host $fwd_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host $fwd_host;

    # 上游地址用变量声明，配合 resolver 实现请求时解析
    set $upstream_backend http://backend:8000;
    set $upstream_frontend http://frontend:3000;

    # ---- 后端 API（含 SSE 流式对话）----
    # 变量名后拼接 $request_uri，确保原样透传完整 URI（含查询串）
    location /api/ {
        proxy_pass $upstream_backend$request_uri;

        # SSE 关键设置：关闭缓冲，放宽超时，避免事件被攒批
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # ---- A2A Server 端点（Agent 对外发布，含 SSE 流式）----
    # /a2a（默认 Agent，无尾斜杠）与 /a2a/...（按 slug 路由）都要转发到后端，
    # 否则会落入前端 location 造成 301 重定向循环
    location = /a2a {
        proxy_pass $upstream_backend$request_uri;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /a2a/ {
        proxy_pass $upstream_backend$request_uri;

        # 流式（SendStreamingMessage 走 SSE）关键设置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # ---- 语音 ASR（WebSocket 流式识别，需 Upgrade 透传）----
    location /ws/ {
        proxy_pass $upstream_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- 后端文档 / 健康检查 ----
    location /docs {
        proxy_pass $upstream_backend$request_uri;
    }

    location /redoc {
        proxy_pass $upstream_backend$request_uri;
    }

    location = /openapi.json {
        proxy_pass $upstream_backend$request_uri;
    }

    location = /health {
        proxy_pass $upstream_backend$request_uri;
    }

    # ---- 前端 Next.js ----
    location / {
        proxy_pass $upstream_frontend$request_uri;
        # 支持 WebSocket / HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

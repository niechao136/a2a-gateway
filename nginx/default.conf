# ===== a2a-gateway 统一反向代理 =====
# 容器内监听 80，由 docker-compose 映射为对外端口 ${GATEWAY_PORT:-10099}。
#   /api/*                 -> 后端 FastAPI (backend:8000)，支持 SSE 流式
#   /docs /redoc /openapi.json /health -> 后端
#   其余所有请求           -> 前端 Next.js (frontend:3000)

upstream a2a_backend {
    server backend:8000;
}

upstream a2a_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # 上传/请求体大小上限
    client_max_body_size 20m;

    # ---- 后端 API（含 SSE 流式对话）----
    location /api/ {
        proxy_pass http://a2a_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键设置：关闭缓冲，放宽超时，避免事件被攒批
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # ---- 后端文档 / 健康检查 ----
    location /docs {
        proxy_pass http://a2a_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://a2a_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://a2a_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://a2a_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- 前端 Next.js ----
    location / {
        proxy_pass http://a2a_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

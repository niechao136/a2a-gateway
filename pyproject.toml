[project]
name = "a2a-gateway"
version = "0.1.0"
description = "基于 LangGraph 的多 Agent 平台，A2A 调用 Hermes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "a2a-sdk>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "mcp>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "basedpyright>=1.40.1",
]

# ---------------------------------------------------------------------------
# Type checking -- run with: uv run basedpyright
#
# `standard` 模式保留所有能捕获真实缺陷的规则（参数/返回值/赋值类型、Optional
# 访问、未绑定变量、未使用的导入与变量、已弃用 API ...），要求 0 error。
#
# 下面关闭的是"类型完备性"规则：它们会在刻意的动态互操作处报错，强行满足只会
# 产生大量无意义的 `Any` 注解：
#   * LangGraph 编译后的图、LangChain Runnable 本身是动态类型
#   * a2a-sdk 的 protobuf `Struct` payload 按设计承载任意 JSON
#   * 第三方库的类型存根不完整或缺失
# ---------------------------------------------------------------------------
[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv/**", ".cache", "**/node_modules/**"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# ===== a2a-gateway 部署编排 =====
# - 前端 / 后端各自构建为独立镜像
# - nginx 作为统一入口反向代理前后端
# - 对外仅暴露 nginx 的 ${GATEWAY_PORT:-10099} 端口
# - PostgreSQL 数据使用宿主机目录挂载（./postgres_data）
#
# 使用方式：
#   cp .env.example .env   # 按需修改
#   docker compose up -d --build
#   浏览器访问 http://<host>:10099

services:
  postgres:
    image: postgres:16-alpine
    container_name: a2a-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-a2a}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a2a_secret}
      POSTGRES_DB: ${POSTGRES_DB:-a2a_gateway}
    # 不向宿主机暴露任何端口：仅在同一 Compose 网络内通过服务名 postgres:5432 访问。
    # 如需用本机客户端直连调试，临时加回：
    #   ports:
    #     - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 目录挂载（bind mount）：数据落在宿主机 ./postgres_data 目录
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-a2a} -d ${POSTGRES_DB:-a2a_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: a2a-gateway-backend:latest
    container_name: a2a-gateway-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-gate:
        condition: service_healthy
    environment:
      # 数据库：容器内通过服务名 postgres 访问，连接串由应用按以下组件自动拼接
      POSTGRES_USER: ${POSTGRES_USER:-a2a}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a2a_secret}
      POSTGRES_DB: ${POSTGRES_DB:-a2a_gateway}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # 默认 Agent 绑定的 Hermes A2A 目标
      HERMES_A2A_URL: ${HERMES_A2A_URL:-http://host.docker.internal:8080/}
      HERMES_A2A_TOKEN: ${HERMES_A2A_TOKEN:-}
      # LLM（OpenAI 兼容端点）
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      # 管理员认证
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      # 经 nginx 统一入口访问时的来源（CORS）
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:10099}
      # 语音服务（onnx-hub）：ASR / TTS 代理
      ONNX_HUB_BASE_URL: ${ONNX_HUB_BASE_URL:-http://43.156.187.79:10100}
      ONNX_HUB_API_KEY: ${ONNX_HUB_API_KEY:-}
      ONNX_HUB_ASR_MODEL: ${ONNX_HUB_ASR_MODEL:-zipformer-streaming-bilingual-zh-en}
      ONNX_HUB_TTS_MODEL: ${ONNX_HUB_TTS_MODEL:-vits-zh-aishell3}
      # 沙箱执行器（Skill 捆绑脚本）：SANDBOX_URL 留空字符串可显式关闭
      SANDBOX_URL: ${SANDBOX_URL:-http://sandbox-gate:8100}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-dev-only-sandbox-token}
    # 让容器可通过 host.docker.internal 访问宿主机服务（Linux 需要此映射，Docker Desktop 自带）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  # ===== 沙箱执行器：gate（前门，有网络）+ runner（执行，无网络）=====
  # 单镜像双角色；gate 经共享 volume 上的 unix socket 转发执行请求（规格 §3.1）
  sandbox-gate:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: a2a-gateway-sandbox:latest
    container_name: a2a-gateway-sandbox-gate
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-dev-only-sandbox-token}
    volumes:
      - sandbox_ipc:/ipc
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true

  sandbox-runner:
    image: a2a-gateway-sandbox:latest
    container_name: a2a-gateway-sandbox-runner
    restart: unless-stopped
    command: ["python", "-m", "sandbox.runner"]
    # 核心隔离：无网络 + 只读 rootfs + 去 capability + 资源上限 + 非 root（规格 §9.1）
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - sandbox_ipc:/ipc
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: a2a-gateway-frontend:latest
    container_name: a2a-gateway-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: a2a-gateway-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # 唯一对外端口
      - "${GATEWAY_PORT:-10099}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  # 沙箱 gate ↔ runner 的 IPC 载体（仅放 unix socket 文件，不落业务数据）
  sandbox_ipc:

services:
  postgres:
    image: postgres:16-alpine
    container_name: a2a-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-a2a}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a2a_secret}
      POSTGRES_DB: ${POSTGRES_DB:-a2a_gateway}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-a2a}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

# Alembic configuration.
# NOTE: the database URL is intentionally NOT set here. It is injected by
# alembic/env.py from the application config (src/a2a_gateway/config.py,
# settings.migration_db_url) so that migrations always use the same
# environment variables as the running application.
# (Keep this file ASCII-only: alembic reads it with the system locale encoding,
#  which is not UTF-8 on some platforms, e.g. Windows.)

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
